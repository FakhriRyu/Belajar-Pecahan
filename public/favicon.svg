<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="100%" stopColor="#0284c7" />
    </linearGradient>

    <!-- Pizza Slice Gradient -->
    <radialGradient id="sliceCheese" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stopColor="#fffbeb" />
      <stop offset="40%" stopColor="#fef08a" />
      <stop offset="100%" stopColor="#f59e0b" />
    </radialGradient>
  </defs>

  <!-- 1. Rounded App Icon Base with 3D Bevel -->
  <rect x="4" y="4" width="92" height="92" rx="26" fill="url(#badgeBg)" stroke="#0369a1" stroke-width="4" />
  <rect x="8" y="8" width="84" height="84" rx="22" fill="none" stroke="#7dd3fc" stroke-width="2" opacity="0.6" />

  <!-- 2. Magic Stars in Background -->
  <circle cx="20" cy="24" r="2.5" fill="#fef08a" />
  <path d="M 80 20 L 82 16 L 84 20 L 88 22 L 84 24 L 82 28 L 80 24 L 76 22 Z" fill="#fde047" />

  <!-- 3. Kibo the Cat (Duolingo Style Head) -->
  <g transform="translate(4, 6)">
    <!-- Cat Ears -->
    <path d="M 28 38 C 22 26, 26 12, 40 18 C 42 24, 38 34, 28 38 Z" fill="#fb923c" stroke="#78350f" stroke-width="3" stroke-linejoin="round" />
    <path d="M 30 32 C 26 24, 28 16, 36 20 Z" fill="#f472b6" />

    <path d="M 64 38 C 70 26, 66 12, 52 18 C 50 24, 54 34, 64 38 Z" fill="#fb923c" stroke="#78350f" stroke-width="3" stroke-linejoin="round" />
    <path d="M 62 32 C 66 24, 64 16, 56 20 Z" fill="#f472b6" />

    <!-- Chubby Cat Head -->
    <ellipse cx="46" cy="54" rx="28" ry="24" fill="#fb923c" stroke="#78350f" stroke-width="3.5" />

    <!-- Tabby Forehead Stripes -->
    <path d="M 46 32 L 46 38" stroke="#ea580c" stroke-width="3" stroke-linecap="round" />
    <path d="M 40 34 L 38 39" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 52 34 L 54 39" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round" />

    <!-- White Belly / Muzzle -->
    <ellipse cx="46" cy="62" rx="18" ry="13" fill="#ffffff" />

    <!-- Rosy Cheeks -->
    <ellipse cx="26" cy="58" rx="5" ry="3.5" fill="#fb7185" opacity="0.7" />
    <ellipse cx="66" cy="58" rx="5" ry="3.5" fill="#fb7185" opacity="0.7" />

    <!-- Big Sparkling Duolingo Eyes -->
    <ellipse cx="36" cy="50" rx="5.5" ry="6.5" fill="#451a03" />
    <ellipse cx="34.5" cy="48" rx="2.5" ry="3" fill="#ffffff" />
    <circle cx="38" cy="53" r="1" fill="#ffffff" />

    <ellipse cx="56" cy="50" rx="5.5" ry="6.5" fill="#451a03" />
    <ellipse cx="54.5" cy="48" rx="2.5" ry="3" fill="#ffffff" />
    <circle cx="58" cy="53" r="1" fill="#ffffff" />

    <!-- Nose & Mouth -->
    <path d="M 44 57 Q 46 55 48 57 Q 46 60 44 57 Z" fill="#f43f5e" stroke="#78350f" stroke-width="1" />
    <path d="M 40 60 Q 43 63 46 60 Q 49 63 52 60" fill="none" stroke="#451a03" stroke-width="2.2" stroke-linecap="round" />

    <!-- Chef Hat -->
    <circle cx="39" cy="18" r="7" fill="#ffffff" stroke="#78350f" stroke-width="2.5" />
    <circle cx="53" cy="18" r="7" fill="#ffffff" stroke="#78350f" stroke-width="2.5" />
    <circle cx="46" cy="14" r="8.5" fill="#ffffff" stroke="#78350f" stroke-width="2.5" />
    <circle cx="46" cy="16" r="8" fill="#ffffff" />
    <rect x="35" y="21" width="22" height="7" rx="2" fill="#ffffff" stroke="#78350f" stroke-width="2.5" />
    <rect x="36" y="24" width="20" height="3" fill="#ef4444" rx="1" />
  </g>

  <!-- 4. Magic Fraction Pizza Slice in Paw -->
  <g transform="translate(62, 52) rotate(15)">
    <!-- Pizza Slice -->
    <path d="M 0 0 L 26 -8 A 30 30 0 0 1 12 24 Z" fill="url(#sliceCheese)" stroke="#78350f" stroke-width="2.5" stroke-linejoin="round" />
    <circle cx="12" cy="6" r="3.5" fill="#ef4444" stroke="#78350f" stroke-width="1" />
    <circle cx="11" cy="5" r="1" fill="#fecaca" />
    
    <!-- Fraction Mark 1/2 -->
    <text x="7" y="18" font-size="7" font-weight="900" font-family="sans-serif" fill="#713f12">½</text>
  </g>
</svg>